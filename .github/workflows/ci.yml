name: CI

# Feature branches are listed explicitly because CI that only watches `main` runs
# on nothing while the work is in progress, and an Actions tab with no runs looks
# exactly like one full of passing runs. All of Stage 4.5 was built without a
# single CI run backing it for precisely this reason.
on:
  push:
    branches: [ main, develop, 'merge/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test
      env:
        NODE_ENV: test

    - name: Build
      run: npm run build
